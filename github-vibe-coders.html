<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub for Vibe Coders - KT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sage-green: #3E513E;
            --dark-charcoal: #2A2C24;
            --olive-brown: #575A4B;
            --taupe: #816C61;
            --white: #FFFFFF;
            --off-white: #CFCFEA;
        }

        a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--sage-green);
            outline-offset: 2px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--white);
            color: var(--dark-charcoal);
            line-height: 1.6;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-charcoal);
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--dark-charcoal);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover { color: var(--sage-green); }

        .connect-btn {
            background-color: var(--sage-green);
            color: var(--white);
            padding: 0.75rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(62, 81, 62, 0.3);
        }

        .arrow-icon {
            font-size: 1.2rem;
            transform: rotate(45deg);
        }

        .project-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--sage-green);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: opacity 0.3s ease;
        }

        .back-link:hover { opacity: 0.7; }

        .project-header { margin-bottom: 3.5rem; }

        .project-number {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--sage-green);
            margin-bottom: 1rem;
        }

        .project-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--dark-charcoal);
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .project-intro {
            font-size: 1.3rem;
            color: var(--olive-brown);
            line-height: 1.8;
        }

        .project-body {
            display: block;
        }

        .project-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--dark-charcoal);
            margin-bottom: 1.25rem;
            margin-top: 3rem;
        }

        .project-content h2:first-child { margin-top: 0; }

        .project-content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--dark-charcoal);
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        .project-content p {
            font-size: 1.05rem;
            color: var(--olive-brown);
            line-height: 1.9;
            margin-bottom: 1.4rem;
        }

        .bullet-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 1.5rem;
        }

        .bullet-list li {
            font-size: 1.05rem;
            color: var(--olive-brown);
            line-height: 1.85;
            padding: 0.5rem 0 0.5rem 1.6rem;
            position: relative;
            border-bottom: 1px solid #E8E6E0;
        }

        .bullet-list li:last-child { border-bottom: none; }

        .bullet-list li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--sage-green);
            font-weight: 600;
        }

        .highlight-box {
            background-color: #F5F4EF;
            border-radius: 15px;
            padding: 2rem 2.5rem;
            margin: 2rem 0;
        }

        .highlight-box .box-label {
            font-weight: 700;
            color: var(--dark-charcoal);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 0.75rem;
        }

        .highlight-box p {
            color: var(--olive-brown);
            font-size: 1.05rem;
            line-height: 1.85;
            margin-bottom: 0;
        }

        .section-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--dark-charcoal);
            margin-bottom: 0.5rem;
            margin-top: 2rem;
        }

        /* ── Storyboard screen cards ── */
        .screen-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1.5rem 0 2rem;
        }

        .screen-card {
            background: #F5F4EF;
            border-radius: 14px;
            padding: 1.5rem 1.5rem 1.4rem;
            text-align: left;
        }

        .screen-card .screen-num {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--taupe);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .screen-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            color: var(--dark-charcoal);
            margin-bottom: 0.5rem;
            margin-top: 0;
            line-height: 1.3;
        }

        .screen-card p {
            font-size: 0.9rem;
            color: var(--olive-brown);
            line-height: 1.65;
            margin-bottom: 0.6rem;
        }

        .screen-card p:last-child { margin-bottom: 0; }

        .interaction-tag {
            display: inline-block;
            background: #fff;
            border: 1.5px solid #D4CFC9;
            border-radius: 50px;
            padding: 0.2rem 0.7rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--sage-green);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Specifications bar — horizontal, sits under the project intro */
        .specs-bar {
            margin-top: 2.5rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .sidebar-card {
            background-color: #F5F4EF;
            border-radius: 15px;
            padding: 1.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.75rem 2.5rem;
        }

        .sidebar-card h2 {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--dark-charcoal);
            margin-bottom: 1rem;
        }

        .sidebar-card .spec-group {
            flex: 1 1 160px;
            min-width: 160px;
        }

        .sidebar-card .spec-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--taupe);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 0.5rem;
        }

        .sidebar-card .spec-item {
            font-size: 0.92rem;
            color: var(--olive-brown);
            line-height: 1.9;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.25rem;
        }

        .tag {
            background: #fff;
            border: 1.5px solid #D4CFC9;
            border-radius: 50px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            color: var(--olive-brown);
            font-weight: 500;
        }

        code {
            font-family: 'Courier New', monospace;
            background: var(--dark-charcoal);
            color: #A8C5A8;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.92em;
        }

        @media (max-width: 860px) {
            nav { flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
            .nav-links { flex-direction: column; gap: 1rem; text-align: center; }
            .project-header h1 { font-size: 2.2rem; }
            .project-page { padding: 2rem 1.5rem; }
            .screen-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .sidebar-card { flex-direction: column; gap: 1.25rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">KT</a>
        <ul class="nav-links">
            <li><a href="index.html">About Me</a></li>
            <li><a href="index.html#portfolio">Projects</a></li>
            <li><a href="lab-notes.html">Lab Notes</a></li>
        </ul>
        <a href="https://www.linkedin.com/in/xuanwentan/" target="_blank" rel="noopener noreferrer" class="connect-btn">
            Connect <span class="arrow-icon">→</span>
        </a>
    </nav>

    <main class="project-page">
        <a href="index.html#portfolio" class="back-link">← Back to Projects</a>

        <div class="project-header">
            <h1>GitHub for Vibe Coders</h1>
        </div>
    </main>
</body>
</html>
